# security-oriented sysctl defaults for internet-facing hosts

# ignore source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# do not trust ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# do not emit ICMP redirects from ordinary hosts
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# log packets with impossible source addresses
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# IPv4 reverse-path filtering: anti-spoofing without breaking common VPS routing
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.*.rp_filter = 2
-net.ipv4.conf.all.rp_filter

# disable IPv6 source routing
net.ipv6.conf.all.accept_source_route = -1
net.ipv6.conf.default.accept_source_route = -1

# restrict kernel log access to privileged users
kernel.dmesg_restrict = 1

# restrict ptrace attach to parent/child relationships where Yama is available
-kernel.yama.ptrace_scope = 1
